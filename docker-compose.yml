services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: subscriptions
      POSTGRES_USER: brightloop
      POSTGRES_PASSWORD: brightloop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightloop -d subscriptions"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    environment:
      DATABASE_URL: postgres://brightloop:brightloop@db:5432/subscriptions
      APP_URL: http://localhost:4000
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}

volumes:
  pgdata:
